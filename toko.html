  {id:"p26270765316", name:"Magnet Bib Number Pink", price:50000, cat:"Magnet Bib Number", desc:"Lihat detail, varian, dan ulasan lengkap di Shopee.", img:"https://down-id.img.susercontent.com/file/id-11134207-7rasf-m3teuh8v5d5o06@resize_w640_nl.webp", shopee:"https://shopee.co.id/product/811917472/26270765316"}
];
/* ========================================= */

const $ = id => document.getElementById(id);
const rp = n => new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(n);
function h(tag, props, ...kids){
  const e = document.createElement(tag);
  for (const k in (props||{})) { if (k === "class") e.className = props[k]; else if (k.startsWith("on")) e.addEventListener(k.slice(2), props[k]); else e.setAttribute(k, props[k]); }
  kids.flat().forEach(c => e.append(c));
  return e;
}
const ls = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };

$("yr").textContent = new Date().getFullYear();
$("shopeeLink").href = SHOPEE_URL;

let cart = {}; try { cart = JSON.parse(ls.get("bn-cart") || "{}") || {}; } catch(e){}
const byId = id => PRODUCTS.find(p => p.id === id);
Object.keys(cart).forEach(id => { if (!byId(id)) delete cart[id]; });
const save = () => ls.set("bn-cart", JSON.stringify(cart));
const total = () => Object.entries(cart).reduce((s,[id,q]) => s + byId(id).price * q, 0);
const qtyAll = () => Object.values(cart).reduce((s,q) => s + q, 0);

let toastT;
function toast(t){ const el = $("toast"); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2200); }

/* ---- katalog ---- */
let cat = "Semua";
const cats = ["Semua", ...new Set(PRODUCTS.map(p => p.cat))];
function drawChips(){
  $("chips").replaceChildren(...cats.map(c => h("button", {class:"chip", type:"button", "aria-pressed": c === cat, onclick(){ cat = c; drawChips(); drawGrid(); }}, c)));
}
function thumb(p){ return p.img ? h("img", {src:p.img, alt:p.name, loading:"lazy", referrerpolicy:"no-referrer"}) : h("i", {"aria-hidden":"true"}, p.name.trim()[0] || "B"); }
function drawGrid(){
  const q = $("q").value.trim().toLowerCase(), s = $("sort").value;
  let list = PRODUCTS.filter(p => (cat === "Semua" || p.cat === cat) && (p.name + " " + p.desc + " " + p.cat).toLowerCase().includes(q));
  if (s === "low") list.sort((a,b) => a.price - b.price);
  if (s === "high") list.sort((a,b) => b.price - a.price);
  if (s === "az") list.sort((a,b) => a.name.localeCompare(b.name, "id"));
  $("count").textContent = list.length + " produk";
  $("empty").hidden = list.length > 0;
  $("grid").replaceChildren(...list.map(p => h("article", {class:"card"},
    h("button", {class:"pic", type:"button", "aria-label":"Lihat detail " + p.name, onclick(){ detail(p); }}, thumb(p), p.tag ? h("span", {class:"tag"}, p.tag) : ""),
    h("div", {class:"info"},
      h("span", {class:"cat"}, p.cat),
      h("h3", {class:"nm"}, p.name),
      h("div", {class:"pr"}, rp(p.price), p.old ? h("s", {}, rp(p.old)) : ""),
      h("button", {class:"add", type:"button", onclick(){ add(p.id); }}, "Tambah ke keranjang")))));
}
$("q").addEventListener("input", drawGrid);
$("sort").addEventListener("change", drawGrid);

/* ---- keranjang ---- */
function add(id, n = 1){
  cart[id] = Math.max(0, (cart[id] || 0) + n);
  if (!cart[id]) delete cart[id];
  save(); badge();
  if (n > 0) toast(byId(id).name + " masuk keranjang");
  if ($("cartSheet")) drawCart();
}
function badge(){ $("cnt").textContent = qtyAll(); }

function orderText(note){
  const lines = Object.entries(cart).map(([id,q]) => "- " + byId(id).name + " x" + q + " = " + rp(byId(id).price * q));
  return WA_OPEN + "\n" + lines.join("\n") + "\nTotal: " + rp(total()) + (note ? "\nCatatan: " + note : "");
}
function closeLayer(){ $("layer").replaceChildren(); document.body.style.overflow = ""; }
function openLayer(...nodes){ $("layer").replaceChildren(h("div", {class:"scrim", onclick:closeLayer}), ...nodes); document.body.style.overflow = "hidden"; }

function drawCart(){
  const box = $("cartSheet"), ids = Object.keys(cart);
  const note = box.querySelector(".note") ? box.querySelector(".note").value : "";
  box.replaceChildren(
    h("div", {class:"sh-h"}, h("h2", {}, "Keranjang"), h("button", {class:"x", type:"button", "aria-label":"Tutup", onclick:closeLayer}, "×")),
    h("div", {class:"items"}, ids.length ? ids.map(id => { const p = byId(id);
      return h("div", {class:"it"},
        h("div", {class:"t"}, h("b", {}, p.name), h("span", {}, rp(p.price))),
        h("div", {class:"qty"},
          h("button", {type:"button", "aria-label":"Kurangi " + p.name, onclick(){ add(id, -1); }}, "−"),
          h("span", {"aria-live":"polite"}, cart[id]),
          h("button", {type:"button", "aria-label":"Tambah " + p.name, onclick(){ add(id, 1); }}, "+")));
    }) : h("p", {class:"empty"}, "Keranjang masih kosong.")),
    ids.length ? h("div", {class:"foot"},
      h("div", {class:"tot"}, h("span", {}, "Total"), h("span", {}, rp(total()))),
      h("input", {class:"note", placeholder:"Catatan (ukuran, warna, alamat)", value:note}),
      h("button", {class:"btn p", type:"button", onclick(){ checkout(box.querySelector(".note").value.trim()); }}, "Pesan via WhatsApp"),
      h("a", {class:"btn", href:SHOPEE_URL, target:"_blank", rel:"noopener noreferrer"}, "Lanjut di Shopee"),
      h("button", {class:"btn", type:"button", onclick(){ cart = {}; save(); badge(); drawCart(); }}, "Kosongkan keranjang")) : "");
}
async function checkout(note){
  const text = orderText(note);
  if (WA_NUMBER.trim()) { window.open("https://wa.me/" + WA_NUMBER.replace(/\D/g, "") + "?text=" + encodeURIComponent(text), "_blank", "noopener"); return; }
  try { await navigator.clipboard.writeText(text); toast("Pesanan disalin. Tempel di chat penjual."); }
  catch(e){ toast("Nomor WhatsApp belum diisi dan salin gagal."); }
}
$("openCart").addEventListener("click", () => { openLayer(h("aside", {class:"sheet cartsheet", id:"cartSheet", role:"dialog", "aria-modal":"true", "aria-label":"Keranjang"})); drawCart(); });

/* ---- detail produk ---- */
function detail(p){
  openLayer(h("section", {class:"sheet dtl", role:"dialog", "aria-modal":"true", "aria-label":p.name},
    h("div", {class:"pic"}, thumb(p), h("button", {class:"x", type:"button", "aria-label":"Tutup", style:"position:absolute;right:6px;top:6px;background:var(--ivory)", onclick:closeLayer}, "×")),
    h("div", {class:"body"},
      h("span", {class:"cat"}, p.cat),
      h("h2", {}, p.name),
      h("div", {class:"pr"}, rp(p.price), p.old ? h("s", {}, rp(p.old)) : ""),
      h("p", {}, p.desc),
      h("button", {class:"btn p", type:"button", onclick(){ add(p.id); closeLayer(); }}, "Tambah ke keranjang"),
      h("a", {class:"btn", href:p.shopee || SHOPEE_URL, target:"_blank", rel:"noopener noreferrer"}, "Beli di Shopee"))));
}
addEventListener("keydown", e => { if (e.key === "Escape") closeLayer(); });

drawChips(); drawGrid(); badge();
</script>
</body>
</html>
