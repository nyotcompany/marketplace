<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulator Bib · NYOTNYOT MARKET</title>
<meta name="description" content="Desain magnet bib bulat atau bib persegi, lihat hasilnya langsung, simpan PNG, lalu kirim ke admin.">
<meta name="theme-color" content="#0e2620">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e2620;--bg2:#16362d;--ivory:#f4f2ec;--ink:#12201b;--muted:#5b6660;--gold:#a8844a;--gold-lt:#d9bf8a;--line:#cfc8b6;--display:"Cormorant Garamond",Georgia,serif;--body:Jost,system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 0%,var(--bg2),var(--bg) 62%);color:var(--ink);font-family:var(--body);padding:calc(16px + env(safe-area-inset-top)) 12px calc(28px + env(safe-area-inset-bottom))}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;background:var(--ivory);border-radius:6px;box-shadow:0 24px 60px rgba(0,0,0,.45),0 0 0 1px rgba(217,191,138,.35);padding:18px 18px 22px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.top a{color:var(--muted);font-size:14px;text-decoration:none;padding:8px 0}
h1{margin:0 0 4px;font-family:var(--display);font-weight:600;font-size:34px;line-height:1}
.sub{margin:0 0 14px;color:var(--muted);font-size:14px}
.tabs,.sw,.mags,.act{display:flex;gap:8px;flex-wrap:wrap}
.tabs{margin-bottom:12px}
.chip,.btn{padding:10px 18px;border-radius:999px;border:1px solid var(--gold);background:transparent;cursor:pointer;min-height:44px;font-weight:500;text-decoration:none;text-align:center}
.chip[aria-pressed=true],.btn.p{background:var(--bg);color:var(--gold-lt);border-color:var(--bg)}
.btn:hover{background:var(--gold-lt);color:var(--ink);border-color:var(--gold-lt)}
canvas{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:10px;background:#f4f2ec;margin-bottom:14px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin-bottom:12px}
.f{display:grid;gap:4px;font-size:14px}.f.w{grid-column:1/-1}
.f input[type=text],.f select{padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;min-width:0;width:100%}
.f input[type=file]{font-size:13px}
.f input[type=range]{width:100%;accent-color:var(--gold)}
#pz label{display:grid;gap:2px}
.sw button,.sw input{width:38px;height:38px;border-radius:50%;border:0;padding:0;cursor:pointer;box-shadow:0 0 0 1px var(--line);background:none}
.sw button[aria-pressed=true]{box-shadow:0 0 0 2px var(--ivory),0 0 0 4px var(--gold)}
.mags button{width:64px;height:64px;padding:4px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer}
.mags button[aria-pressed=true]{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.mags img{width:100%;height:100%;display:block}
.act{margin-top:6px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));margin:0 auto;max-width:380px;padding:11px 16px;border-radius:12px;background:var(--bg);color:var(--gold-lt);text-align:center;z-index:9}
@media(max-width:480px){.g{grid-template-columns:1fr}}
</style>
</head>

<main class="wrap">
  <div class="top"><a href="index.html">← Kembali</a><a href="toko.html">Ke toko</a></div>
  <h1>Simulator Bib</h1>
  <p class="sub">Atur desain, lihat hasilnya langsung, simpan PNG, lalu kirim ke admin.</p>
  <div class="tabs" role="group" aria-label="Tampilan"><button class="chip" type="button" id="tR" aria-pressed="true">Magnet bulat</button><button class="chip" type="button" id="tB" aria-pressed="false">Bib persegi</button></div>
  <canvas id="cv" width="1200" height="600" role="img" aria-label="Pratinjau desain"></canvas>
  <div class="g">
    <label class="f">Nama<input type="text" id="nm" maxlength="14" placeholder="NAMA KAMU" autocomplete="off"></label>
    <label class="f">Nomor<input type="text" id="no" maxlength="4" inputmode="numeric" placeholder="26" autocomplete="off"></label>
    <label class="f">Tulisan kecil (komunitas / event)<input type="text" id="tg" maxlength="24" placeholder="NYOTNYOT MARKET" autocomplete="off"></label>
    <label class="f">Font<select id="ft"><option>Klasik</option><option>Modern</option><option>Tebal</option></select></label>
    <div class="f w">Warna latar<div class="sw" id="sw"></div></div>
    <label class="f w">Foto atau logo (nanti ada di dalam resin bening)<input type="file" id="lg" accept="image/*"></label>
    <div class="f w" id="pz" hidden><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="ot"> Tambahkan tulisan di atas foto</label><label>Zoom<input type="range" id="zm" min="1" max="3" step=".05" value="1"></label><label>Geser kiri–kanan<input type="range" id="gx" min="-100" max="100" value="0"></label><label>Geser atas–bawah<input type="range" id="gy" min="-100" max="100" value="0"></label></div>
  </div>
  <div class="act"><button class="btn p" type="button" id="sv">Simpan PNG</button><button class="btn" type="button" id="wa">Kirim ke WhatsApp</button><button class="btn" type="button" id="rd">Acak</button></div>
</main>

const $ = id => document.getElementById(id), cv = $("cv"), x = cv.getContext("2d");
const BIB_MM = 210, MAG_MM = 16;  // lebar bib (mm) dan diameter magnet (mm); ubah sesuai ukuran asli
const IM = {}; Object.keys(MAG).forEach(k => { const i = new Image(); i.onload = draw; i.src = MAG[k]; IM[k] = i; });
const S = {mode:"R", bg:PAL[0], mag:"Polos", photo:null, z:1, px:0, py:0};
const say = t => { const e = $("toast"); e.textContent = t; e.hidden = false; clearTimeout(say.t); say.t = setTimeout(() => e.hidden = true, 2800); };
const ink = c => { const n = parseInt(c.slice(1), 16), l = .299 * (n >> 16) + .587 * (n >> 8 & 255) + .114 * (n & 255); return c === "#0e2620" ? "#d9bf8a" : l > 150 ? "#12201b" : "#ffffff"; };
const raw = () => ({nm:$("nm").value.trim().toUpperCase(), no:$("no").value.replace(/\D/g, ""), tg:$("tg").value.trim().toUpperCase()});
const tv = () => { const r = raw(); return (r.nm || r.no || r.tg) ? r : {nm:"NAMA KAMU", no:"26", tg:"NYOTNYOT MARKET"}; };
const val = () => (S.photo && S.mode === "R") ? raw() : tv();
const font = (sz, w) => { const f = FONTS[$("ft").value]; return (w || f[0]) + " " + Math.round(sz) + "px " + f[1]; };
function ls(v){ try { x.letterSpacing = v; } catch(e){} }
function fit(t, sz, maxW, w){ x.font = font(sz, w); while (sz > 10 && x.measureText(t).width > maxW) { sz -= 3; x.font = font(sz, w); } return sz; }
function put(t, cx, cy, fg, sz){
  if (S.photo && S.mode === "R") { x.save(); x.lineJoin = "round"; x.lineWidth = Math.max(4, sz * .14); x.strokeStyle = fg === "#ffffff" || fg === "#d9bf8a" ? "rgba(0,0,0,.55)" : "rgba(255,255,255,.7)"; x.strokeText(t, cx, cy); x.restore(); }
  x.fillText(t, cx, cy);
}
function art(cx, cy, w, h, fg){
  const v = val(); x.fillStyle = fg; x.textAlign = "center"; x.textBaseline = "middle";
  if (v.tg) { ls("3px"); const a = fit(v.tg, h * .055, w * .8, "500"); x.font = font(a, "500"); put(v.tg, cx, cy - h * .34, fg, a); }
  if (v.no) { ls("0px"); const a = fit(v.no, h * .5, w * .82); x.font = font(a); put(v.no, cx, cy + h * .03, fg, a); }
  if (v.nm) { ls("2px"); const a = fit(v.nm, h * .11, w * .8); x.font = font(a); put(v.nm, cx, cy + h * .34, fg, a); }
  ls("0px");
}
function rim(cx, cy, r){
  const g = x.createLinearGradient(cx - r, cy - r, cx + r, cy + r); g.addColorStop(0, "#f5f6f8"); g.addColorStop(.5, "#a9afb7"); g.addColorStop(1, "#eceef1");
  x.save(); x.shadowColor = "rgba(0,0,0,.3)"; x.shadowBlur = r * .12; x.shadowOffsetY = r * .04; x.fillStyle = g; x.beginPath(); x.arc(cx, cy, r * 1.08, 0, 7); x.fill(); x.restore();
}
function cover(cx, cy, r){
  const p = S.photo, k = Math.max(2 * r / p.width, 2 * r / p.height) * S.z, w = p.width * k, h = p.height * k;
  x.drawImage(p, cx - w / 2 + S.px / 100 * (w - 2 * r) / 2, cy - h / 2 + S.py / 100 * (h - 2 * r) / 2, w, h);
}
/* lapisan resin cembung: bayangan tepi, pantulan cahaya, titik kilau */
function dome(cx, cy, r, k){
  x.save(); x.globalAlpha = k || .55;
  let g = x.createRadialGradient(cx, cy, r * .55, cx, cy, r); g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,.28)"); x.fillStyle = g; x.fillRect(cx - r, cy - r, 2 * r, 2 * r);
  x.save(); x.translate(cx - r * .22, cy - r * .5); x.rotate(-.45); g = x.createLinearGradient(0, -r * .3, 0, r * .3); g.addColorStop(0, "rgba(255,255,255,.6)"); g.addColorStop(1, "rgba(255,255,255,0)");
  x.fillStyle = g; x.beginPath(); x.ellipse(0, 0, r * .6, r * .28, 0, 0, 7); x.fill(); x.restore();
  x.fillStyle = "rgba(255,255,255,.85)"; x.beginPath(); x.arc(cx - r * .5, cy - r * .52, r * .05, 0, 7); x.fill();
  x.strokeStyle = "rgba(255,255,255,.28)"; x.lineWidth = r * .04; x.beginPath(); x.arc(cx, cy, r * .93, .15, 1.2); x.stroke();
  /* tepi resin: cincin gelap tipis + cahaya terbias di sisi bawah */
  x.strokeStyle = "rgba(0,0,0,.22)"; x.lineWidth = r * .035; x.beginPath(); x.arc(cx, cy, r * .975, 0, 7); x.stroke();
  g = x.createRadialGradient(cx + r * .25, cy + r * .6, 0, cx + r * .25, cy + r * .6, r * .55); g.addColorStop(0, "rgba(255,255,255,.22)"); g.addColorStop(1, "rgba(255,255,255,0)");
  x.fillStyle = g; x.fillRect(cx - r, cy - r, 2 * r, 2 * r);
  x.restore();
}
function disc(cx, cy, r){
  rim(cx, cy, r); x.save(); x.beginPath(); x.arc(cx, cy, r, 0, 7); x.clip();
  if (S.photo) cover(cx, cy, r); else { x.fillStyle = S.bg; x.fillRect(cx - r, cy - r, 2 * r, 2 * r); x.globalAlpha = .55; x.strokeStyle = ink(S.bg); x.lineWidth = Math.max(1, r * .012); x.beginPath(); x.arc(cx, cy, r * .92, 0, 7); x.stroke(); x.globalAlpha = 1; }
  dome(cx, cy, r); x.restore();
  x.strokeStyle = "rgba(0,0,0,.25)"; x.lineWidth = Math.max(1.5, r * .02); x.beginPath(); x.arc(cx, cy, r, 0, 7); x.stroke();
}
function draw(){
  const fg = ink(S.bg);
  if (S.mode === "R") {
    cv.width = 1200; cv.height = 640; x.fillStyle = "#f4f2ec"; x.fillRect(0, 0, 1200, 640);
    const r = 235, cy = 290;
    rim(300, cy, r); x.save(); x.beginPath(); x.arc(300, cy, r, 0, 7); x.clip(); x.fillStyle = S.bg; x.fillRect(300 - r, cy - r, 2 * r, 2 * r);
    if (S.photo) cover(300, cy, r); else { x.globalAlpha = .55; x.strokeStyle = fg; x.lineWidth = 3; x.beginPath(); x.arc(300, cy, r * .92, 0, 7); x.stroke(); x.globalAlpha = 1; }
    if (!S.photo || $("ot").checked) art(300, cy, r * 1.8, r * 1.8, fg);
    dome(300, cy, r); x.restore();
    x.strokeStyle = "rgba(0,0,0,.25)"; x.lineWidth = 3; x.beginPath(); x.arc(300, cy, r, 0, 7); x.stroke();
    const d = 2 * r * 1.08; if (IM[S.mag].complete) x.drawImage(IM[S.mag], 900 - d / 2, cy - d / 2, d, d);
    x.fillStyle = "#5b6660"; x.font = "500 26px Jost, sans-serif"; x.textAlign = "center"; x.textBaseline = "alphabetic"; x.fillText("Tampak depan", 300, 600); x.fillText("Tampak belakang", 900, 600);
  } else {
    cv.width = 900; cv.height = 570; x.fillStyle = "#f4f2ec"; x.fillRect(0, 0, 900, 570);
    x.save(); x.shadowColor = "rgba(0,0,0,.25)"; x.shadowBlur = 24; x.shadowOffsetY = 8; x.fillStyle = S.bg; x.beginPath(); x.roundRect(18, 14, 864, 536, 36); x.fill(); x.restore();
    x.globalAlpha = .55; x.strokeStyle = fg; x.lineWidth = 3; x.beginPath(); x.roundRect(42, 38, 816, 488, 24); x.stroke(); x.globalAlpha = 1;
    art(450, 282, 640, 470, fg);
    const rr = MAG_MM / 2 * (864 / BIB_MM) / 1.08;
    [[72, 72], [828, 72], [72, 498], [828, 498]].forEach(([a, b]) => disc(a, b, rr));
  }
}
function save(){ draw(); cv.toBlob(b => { if (!b) { say("Gagal membuat gambar."); return; } const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "desain-" + (S.mode === "R" ? "bulat" : "bib") + "-" + (raw().no || "foto") + ".png"; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }, "image/png"); }
function setMode(m){ S.mode = m; $("tR").setAttribute("aria-pressed", m === "R"); $("tB").setAttribute("aria-pressed", m === "B"); draw(); }
function mark(){ document.querySelectorAll("#sw button").forEach(b => b.setAttribute("aria-pressed", b.dataset.c === S.bg)); }
PAL.forEach(c => { const b = document.createElement("button"); b.type = "button"; b.dataset.c = c; b.style.background = c; b.setAttribute("aria-label", "Warna " + c); b.addEventListener("click", () => { S.bg = c; mark(); draw(); }); $("sw").append(b); });
const cc = Object.assign(document.createElement("input"), {type:"color", value:"#7a3b8f", title:"Warna lain"}); cc.setAttribute("aria-label", "Warna lain");
cc.addEventListener("input", () => { S.bg = cc.value; mark(); draw(); }); $("sw").append(cc);
["nm", "no", "tg"].forEach(i => $(i).addEventListener("input", draw)); $("ft").addEventListener("change", draw); $("ot").addEventListener("change", draw);
$("lg").addEventListener("change", e => { const f = e.target.files[0]; if (!f) { S.photo = null; $("pz").hidden = true; draw(); return; } const i = new Image(); i.onerror = () => { say("Foto tidak bisa dibaca. Coba JPG atau PNG, atau screenshot fotonya."); }; i.onload = () => { const m = Math.min(1, 1600 / Math.max(i.naturalWidth, i.naturalHeight)), c = document.createElement("canvas"); c.width = Math.round(i.naturalWidth * m); c.height = Math.round(i.naturalHeight * m); c.getContext("2d").drawImage(i, 0, 0, c.width, c.height); S.photo = c; say("Foto terpasang di magnet."); S.z = 1; S.px = S.py = 0; $("zm").value = 1; $("gx").value = $("gy").value = 0; $("pz").hidden = false; draw(); }; i.src = URL.createObjectURL(f); });
[["zm","z"],["gx","px"],["gy","py"]].forEach(([id, k]) => $(id).addEventListener("input", e => { S[k] = +e.target.value; draw(); }));
$("tR").addEventListener("click", () => setMode("R")); $("tB").addEventListener("click", () => setMode("B"));
$("sv").addEventListener("click", () => { save(); say("Gambar desain disimpan."); });
$("rd").addEventListener("click", () => { S.bg = PAL[Math.random() * PAL.length | 0]; $("no").value = 1 + Math.random() * 999 | 0; $("ft").selectedIndex = Math.random() * 3 | 0; mark(); draw(); });
$("wa").addEventListener("click", () => {
  const v = raw(), t = "Halo NYOTNYOT MARKET, saya mau pesan magnet bib custom:\nModel: " + (S.mode === "R" ? "Magnet bulat" : "Bib persegi") + "\nFoto/logo: " + (S.photo ? "ada (saya kirim di chat)" : "tidak ada") + "\nNama: " + (v.nm || "-") + "\nNomor: " + (v.no || "-") + "\nTulisan kecil: " + (v.tg || "-") + "\nWarna latar: " + S.bg + "\nFont: " + $("ft").value + "\nLapisan: resin bening\n(Gambar desain saya lampirkan di chat ini)";
  if (WA_NUMBER.trim()) window.open("https://wa.me/" + WA_NUMBER.replace(/\D/g, "") + "?text=" + encodeURIComponent(t), "_blank", "noopener");
  else navigator.clipboard.writeText(t).then(() => say("Detail desain disalin. Tempel di chat penjual."), () => say("Nomor WhatsApp belum diisi."));
  save();
});
mark(); draw();
Promise.all(['600 20px "Cormorant Garamond"', "500 20px Jost"].map(f => document.fonts.load(f))).then(draw, () => {});
</script>
